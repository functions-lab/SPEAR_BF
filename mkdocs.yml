site_name: SPEAR-BF RFSoC RFDC Documentation
site_description: Auto-generated API documentation for the rfsoc_rfdc Python package
site_url: https://functions-lab.github.io/SPEAR_BF/
repo_url: https://github.com/functions-lab/SPEAR_BF
repo_name: functions-lab/SPEAR_BF

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            inherited_members: false
            filters:
              - "!^_"   # exclude private members (single underscore)
              - "!^__"  # exclude dunder members

nav:
  - Home: index.md
  - API Reference:
    - Core:
      - RFDC: api/rfdc.md
      - RFDC Config: api/rfdc_config.md
      - RFDC Task: api/rfdc_task.md
      - RFDC Types: api/rfdc_type.md
      - Overlay Task: api/overlay_task.md
      - RFSoC Overlay: api/rfsoc_overlay.md
      - Clocks: api/clocks.md
      - DMA Monitor: api/dma_monitor.md
      - Waveform Generator: api/waveform_generator.md
      - Sample Logger: api/sample_logger.md
      - IQ Loader: api/iq_loader.md
      - Multi-Channel Memory Layout: api/multi_ch_mem_layout.md
      - Throughput Timer: api/throughput_timer.md
      - Text Logger: api/txt_logger.md
    - DSP:
      - OFDM: api/dsp/ofdm.md
      - Detection: api/dsp/detection.md
      - FMCW: api/dsp/fmcw.md
      - MIMO Detection: api/dsp/mimo_detection.md
      - CHARM Beamformer: api/dsp/charm_beamformer.md
      - Array Factor: api/dsp/array_factor.md
      - Radar Detection: api/dsp/radar_detection.md
      - Unit Conversion: api/dsp/unit_convt.md
    - Receiver:
      - RX Channel: api/receiver/rx_channel.md
      - Multi-Channel RX Task: api/receiver/multi_ch_rx_task.md
      - Multi-Channel RX MIMO: api/receiver/multi_ch_rx_mimo_task.md
      - Multi-Channel RX Independent: api/receiver/multi_ch_rx_indept_task.md
      - Single-Channel RX Task: api/receiver/single_ch_rx_task.md
      - FMCW RX Task: api/receiver/fmcw_rx_task.md
      - RX Analyzer:
        - Drivers: api/receiver/rx_analyzer/drivers.md
        - Pipelines: api/receiver/rx_analyzer/pipelines.md
        - Components: api/receiver/rx_analyzer/components.md
    - Transmitter:
      - TX Channel: api/transmitter/tx_channel.md
      - TX Data Generator: api/transmitter/tx_data_generator.md
      - Multi-Channel TX Task: api/transmitter/multi_ch_tx_task.md
      - Multi-Channel TX MIMO: api/transmitter/multi_ch_tx_mimo_task.md
      - Multi-Channel TX Independent: api/transmitter/multi_ch_tx_indept_task.md
      - Single-Channel TX Task: api/transmitter/single_ch_tx_task.md
    - Plotter:
      - FFT Plotter: api/plotter/fft_plotter.md
      - Signal Plotter: api/plotter/signal_plotter.md
      - Radiation Plotter: api/plotter/radiation_plotter.md
      - BER Plot: api/plotter/ber_plot.md
      - EVM Plot: api/plotter/evm_plot.md
      - Plot Format: api/plotter/plot_format.md
    - Measurement:
      - Link Metrics: api/measurement/link_metrics.md
    - Tasks:
      - Array Calibration Task: api/array_calib_task.md
      - Beamformer Task: api/beamformer_task.md
      - CMAC Task: api/cmac_task.md
      - MTS Task: api/mts_task.md
    - TIQC:
      - Digitizer: api/tiqc/digitizer.md
      - Pulse Generator: api/tiqc/gen_pulse.md
      - Scheduler: api/tiqc/scheduler.md
      - Square Wave: api/tiqc/square_wave.md
      - Single Qubit RB: api/tiqc/single_qubit_rb.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/functions-lab
